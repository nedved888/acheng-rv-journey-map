<style>
  :root{ --bg:#0f1419; --panel:#161d26; --panel2:#1d2733; --line:#2a3746; --txt:#e8eef5; --dim:#8fa3b8; --accent:#ffb703; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;background:var(--bg);color:var(--txt);}
  #app{display:flex;height:100vh;overflow:hidden;}
  #side{width:378px;min-width:378px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%;}
  #side.hide{display:none;}
  .hd{padding:13px 16px 9px;border-bottom:1px solid var(--line);}
  .hd h1{margin:0 0 4px;font-size:16.5px;line-height:1.35;}
  .hd .sub{font-size:11.5px;color:var(--dim);line-height:1.6;}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:9px 16px;border-bottom:1px solid var(--line);}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;}
  .stat b{display:block;font-size:14.5px;color:var(--accent);}
  .stat span{font-size:10.5px;color:var(--dim);}
  .sec{padding:9px 16px 3px;font-size:11.5px;color:var(--dim);letter-spacing:.5px;display:flex;justify-content:space-between;}
  .sec em{font-style:normal;color:#5f7183;}
  #legend{padding:0 12px 6px;display:flex;flex-direction:column;gap:3px;max-height:212px;overflow:auto;}
  .lg{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:4px 7px;border-radius:7px;cursor:pointer;border:1px solid transparent;line-height:1.35;}
  .lg:hover{background:var(--panel2);}
  .lg.off{opacity:.32;}
  .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;}
  .lg .rg{margin-left:auto;color:var(--dim);font-size:10px;white-space:nowrap;}
  #list{flex:1;overflow-y:auto;padding:6px 10px 20px;}
  .it{display:flex;gap:9px;padding:6px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent;align-items:flex-start;}
  .it:hover,.it.on{background:var(--panel2);border-color:var(--line);}
  .it .no{width:20px;height:20px;flex:0 0 auto;border-radius:50%;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;margin-top:1px;}
  .it .bd{min-width:0;}
  .it .dt{font-size:10.5px;color:var(--accent);font-variant-numeric:tabular-nums;}
  .it .nm{font-size:12.5px;font-weight:600;line-height:1.4;}
  .it .ds{font-size:11px;color:var(--dim);line-height:1.45;margin-top:1px;}
  .it.key .nm::after{content:" ★";color:#ff6b6b;}
  #wrap{flex:1;position:relative;}
  #map{position:absolute;inset:0;background:#0b0f14;}
  #bar{position:absolute;z-index:800;top:12px;left:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;}
  .grp{display:flex;gap:6px;flex-wrap:wrap;background:rgba(22,29,38,.93);border:1px solid var(--line);border-radius:10px;padding:6px;align-items:center;}
  .grp .lb{font-size:11px;color:var(--dim);padding:0 3px;}
  .btn{background:transparent;color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit;}
  .btn:hover{background:#243040;}
  .btn.on{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:700;}
  .leaflet-popup-content-wrapper{background:var(--panel);color:var(--txt);border-radius:10px;border:1px solid var(--line);}
  .leaflet-popup-tip{background:var(--panel);}
  .leaflet-popup-content{margin:11px 14px;font-size:12.5px;line-height:1.6;min-width:230px;max-width:330px;}
  .pp .dt{color:var(--accent);font-size:11.5px;font-weight:700;letter-spacing:.4px;}
  .pp .nm{font-size:14.5px;font-weight:700;margin:3px 0 5px;}
  .pp .tg{display:inline-block;border-radius:5px;padding:1px 7px;font-size:10.5px;margin-bottom:6px;}
  .pp .ds{color:#c6d4e2;font-size:12px;}
  .pp .small{color:#93a7bb;font-size:11px;margin-top:6px;border-top:1px dashed #2a3746;padding-top:5px;}
  .mk{display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-size:10px;font-weight:700;
      border:2px solid rgba(255,255,255,.85);box-shadow:0 1px 6px rgba(0,0,0,.6);font-family:"Microsoft YaHei",sans-serif;}
  .mk.key{animation:pulse 2.1s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,107,107,.75);}70%{box-shadow:0 0 0 12px rgba(255,107,107,0);}100%{box-shadow:0 0 0 0 rgba(255,107,107,0);}}
  #sideToggle{position:absolute;z-index:900;top:12px;left:12px;display:none;}
  .note{padding:7px 16px 12px;font-size:10.5px;color:var(--dim);line-height:1.6;border-top:1px solid var(--line);}
  @media (max-width:860px){
    #side{position:absolute;z-index:1000;height:100%;box-shadow:0 0 30px #000;}
    #side.hide{display:none;}
    #sideToggle{display:block;}
    #side:not(.hide) ~ #wrap #sideToggle{display:none;}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="hd">
      <h1>阿程的小房车之旅 · 全国轨迹详图</h1>
      <div class="sub">一个骑着三轮小房车穷游中国的 90 后。抖音 760 条作品的标题、时间与点赞全部还原，时间取自服务器时间戳。</div>
    </div>
    <div class="stats">
      <div class="stat"><b>3 年 6 个月</b><span>2023.04.14 → 2026.09.30</span></div>
      <div class="stat"><b>16 个</b><span>走过的省级行政区</span></div>
      <div class="stat"><b id="sN">—</b><span>可确证的地点</span></div>
      <div class="stat"><b>110.6 万</b><span>抖音粉丝（获赞 1434 万）</span></div>
    </div>
    <div class="sec">旅行阶段（点击可隐藏／显示）</div>
    <div id="legend"></div>
    <div class="sec">时间线 <em>★＝重要事件</em></div>
    <div id="list"></div>
    <div class="note">底图：高德地图（GCJ-02 已校正）。实心大点＝视频中可确证的地点；小点＝其余作品按时间在轨迹上定位（推算位置）。虚线＝回家／乘机往返。</div>
  </aside>
  <div id="wrap">
    <div id="map"></div>
    <button id="sideToggle" class="btn">☰ 时间线</button>
    <div id="bar">
      <div class="grp">
        <button class="btn on" id="bRoad">地图</button>
        <button class="btn" id="bSat">卫星</button>
        <button class="btn" id="bAll">全览</button>
        <button class="btn" id="bPlay">▶ 播放轨迹</button>
      </div>
      <div class="grp">
        <span class="lb">图层</span>
        <button class="btn on" id="tSt">精确站点</button>
        <button class="btn on" id="tVid">全部作品</button>
        <button class="btn on" id="tLine">轨迹线</button>
      </div>
    </div>
  </div>
</div>

<script>
const PHASES = [{"id": "A", "name": "人力拖挂小房车 · 华南→华中→华北→东北", "range": "2023.04 – 2024.04", "color": "#e8590c"}, {"id": "B", "name": "换轻型房车 · 华北→山东→山西→陕西→宁夏→甘肃→新疆", "range": "2024.05 – 2025.01", "color": "#1c7ed6"}, {"id": "C", "name": "房车被吹毁 · 山东考驾照改电三轮", "range": "2025.02 – 2025.06", "color": "#2f9e44"}, {"id": "D", "name": "内蒙→宁夏→甘肃→敦煌无人区→新疆→独库公路", "range": "2025.06 – 2025.09", "color": "#7048e8"}, {"id": "E", "name": "回家返疆 · 库车→喀什→帕米尔高原", "range": "2025.09 – 2026.03", "color": "#e64980"}, {"id": "F", "name": "喀什→塔克拉玛干→和田→民丰→G216羌塘（第一次）", "range": "2026.03 – 2026.06", "color": "#0c8599"}, {"id": "G", "name": "回家返疆 · 反穿羌塘（进行中）", "range": "2026.06 – 2026.09", "color": "#adb5bd"}];

  r += (20*Math.sin(6*x*PI) + 20*Math.sin(2*x*PI)) * 2/3;
  r += (20*Math.sin(x*PI) + 40*Math.sin(x/3*PI)) * 2/3;
  r += (150*Math.sin(x/12*PI) + 300*Math.sin(x/30*PI)) * 2/3; return r; }
function gcj(lat, lng){
  if (outOfChina(lng, lat)) return [lat, lng];
  let dLat = tLat(lng - 105.0, lat - 35.0), dLng = tLng(lng - 105.0, lat - 35.0);
  const radLat = lat / 180.0 * PI; let magic = Math.sin(radLat); magic = 1 - EE*magic*magic;
  const sq = Math.sqrt(magic);
  dLat = (dLat * 180.0) / ((AXIS * (1 - EE)) / (magic * sq) * PI);
  dLng = (dLng * 180.0) / (AXIS / sq * Math.cos(radLat) * PI);
  return [lat + dLat, lng + dLng];
}
const G = ST.map(s => gcj(s.lat, s.lng));
const GV = VD.map(v => gcj(v[0], v[1]));

const map = L.map('map', {zoomControl:false, preferCanvas:true}).setView([34.5, 100.0], 4);
L.control.zoom({position:'bottomright'}).addTo(map);
L.control.scale({imperial:false, position:'bottomright'}).addTo(map);
const road = L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
  {subdomains:['1','2','3','4'], maxZoom:18, attribution:'&copy; 高德地图'}).addTo(map);
const sat = L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}', {subdomains:['1','2','3','4'], maxZoom:18});
const satLbl = L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=8&x={x}&y={y}&z={z}', {subdomains:['1','2','3','4'], maxZoom:18});

const hidden = {}; PHASES.forEach(p => hidden[p.id] = false);
const gLine = L.layerGroup().addTo(map), gMark = L.layerGroup().addTo(map), gVid = L.layerGroup().addTo(map);

/* 轨迹线：逐段按阶段着色 */
ST.forEach((s, i) => {
  if (i === 0) return;
  const isFly = s.mode === 'fly';
  L.polyline([G[i-1], G[i]], {color: PH[s.p].color, weight: isFly ? 2 : 3.2, opacity: isFly ? .6 : .92,
    dashArray: isFly ? '7,9' : null, lineCap:'round'}).addTo(gLine);
});

/* 精确站点 */
const markers = [];
ST.forEach((s, i) => {
  const ph = PH[s.p], size = s.key ? 26 : 20;
  const icon = L.divIcon({className:'', html:'<div class="mk' + (s.key ? ' key' : '') + '" style="width:'+size+'px;height:'+size+'px;background:'+ph.color+';'+(s.key?'border-color:#ff6b6b;':'')+'">'+(i+1)+'</div>',
    iconSize:[size,size], iconAnchor:[size/2,size/2]});
  const mk = L.marker(G[i], {icon:icon, riseOnHover:true});
  mk.bindPopup('<div class="pp"><div class="dt">'+s.d+'　第 '+(i+1)+' 站</div><div class="nm">'+s.n+'</div>'+
    '<div class="tg" style="background:'+ph.color+'33;color:'+ph.color+'">'+ph.name+'</div>'+
    '<div class="ds"><b>'+s.t+'</b><br>'+s.desc+'</div></div>', {maxWidth:350, autoPan:false});
  mk.on('click', () => select(i, false));
  mk.addTo(gMark); markers.push(mk);
});

/* 全部作品点（按时间在轨迹上定位） */
const vmarks = [];
VD.forEach((v, i) => {
  const inner = (v[5] === v[6]);
  const cm = L.circleMarker(GV[i], {radius: inner ? 3.4 : 2.6, color: inner ? '#ffd166' : '#e9f2fb',
    weight: 1, opacity: .85, fillColor: inner ? '#ffb703' : '#9fc0dd', fillOpacity: .75});
  cm.bindPopup('<div class="pp"><div class="dt">'+v[2]+'　作品 '+(i+1)+'/'+VD.length+'</div>'+
    '<div class="ds">'+v[3]+'</div>'+
    '<div class="small">点赞 '+(v[4]>=10000 ? (v[4]/10000).toFixed(1)+'万' : v[4])+
    (inner ? '　·　该日有确证站点' : '　·　位置按时间在「'+ST[v[5]].n+'」→「'+ST[v[6]].n+'」之间推算')+'</div></div>',
    {maxWidth:330, autoPan:false});
  cm.addTo(gVid); vmarks.push(cm);
});

/* 侧栏 */
const legend = document.getElementById('legend');
PHASES.forEach(p => {
  const el = document.createElement('div');
  el.className = 'lg';
  el.innerHTML = '<span class="dot" style="background:'+p.color+'"></span><span>'+p.name+'</span><span class="rg">'+p.range+'</span>';
  el.onclick = () => {
    hidden[p.id] = !hidden[p.id];
    el.classList.toggle('off', hidden[p.id]);
    refresh();
  };
  legend.appendChild(el);
});
function refresh(){
  ST.forEach((s, i) => {
    const on = !hidden[s.p];
    if (on && !gMark.hasLayer(markers[i])) gMark.addLayer(markers[i]);
    if (!on && gMark.hasLayer(markers[i])) gMark.removeLayer(markers[i]);
  });
  gLine.clearLayers();
  ST.forEach((s, i) => {
    if (i === 0 || hidden[ST[i].p] || hidden[ST[i-1].p]) return;
    const isFly = s.mode === 'fly';
    L.polyline([G[i-1], G[i]], {color: PH[s.p].color, weight: isFly ? 2 : 3.2, opacity: isFly ? .6 : .92,
      dashArray: isFly ? '7,9' : null, lineCap:'round'}).addTo(gLine);
  });
}

const list = document.getElementById('list'), items = [];
ST.forEach((s, i) => {
  const ph = PH[s.p], el = document.createElement('div');
  el.className = 'it' + (s.key ? ' key' : '');
  el.innerHTML = '<div class="no" style="background:'+ph.color+'">'+(i+1)+'</div><div class="bd">'+
    '<div class="dt">'+s.d+'</div><div class="nm">'+s.n+'</div><div class="ds">'+s.t+'</div></div>';
  el.onclick = () => select(i, true);
  list.appendChild(el); items.push(el);
});

function select(idx, fly){
  items.forEach((e,i) => e.classList.toggle('on', i === idx));
  if (items[idx]) items[idx].scrollIntoView({block:'nearest'});
  const s = ST[idx];
  if (hidden[s.p]){ hidden[s.p] = false;
    [...legend.children].forEach((c,i)=>{ if(PHASES[i].id === s.p) c.classList.remove('off'); });
    refresh();
  }
  markers[idx].openPopup();
  if (fly) map.flyTo(G[idx], Math.max(map.getZoom(), 9), {duration:1.0});
}

/* 顶栏 */
const bRoad=document.getElementById('bRoad'), bSat=document.getElementById('bSat');
function setBase(satOn){ if(satOn){ map.removeLayer(road); sat.addTo(map); satLbl.addTo(map);} else { map.removeLayer(sat); map.removeLayer(satLbl); road.addTo(map);} 
  bSat.classList.toggle('on',satOn); bRoad.classList.toggle('on',!satOn); }
bRoad.onclick=()=>setBase(false);
bSat.onclick=()=>{ if(!map.hasLayer(sat)) setBase(true); };
document.getElementById('bAll').onclick=()=>{ map.flyToBounds(L.latLngBounds(G), {padding:[40,40], duration:1.0}); };

function toggle(btnId, layer){
  const b=document.getElementById(btnId);
  b.onclick=()=>{ if(map.hasLayer(layer)){ map.removeLayer(layer); b.classList.remove('on'); }
                  else { layer.addTo(map); b.classList.add('on'); } };
}
toggle('tSt', gMark); toggle('tVid', gVid); toggle('tLine', gLine);

let playing=false, timer=null;
document.getElementById('bPlay').onclick=function(){
  if(playing){ clearInterval(timer); playing=false; this.textContent='▶ 播放轨迹'; this.classList.remove('on'); return; }
  playing=true; this.textContent='⏸ 停止'; this.classList.add('on');
  const prog=L.layerGroup().addTo(map); let i=1;
  map.setView(G[0], 6);
  timer=setInterval(()=>{
    if(i>=ST.length){ clearInterval(timer); playing=false;
      document.getElementById('bPlay').textContent='▶ 播放轨迹';
      document.getElementById('bPlay').classList.remove('on'); map.removeLayer(prog); return; }
    const isFly = ST[i].mode === 'fly';
    L.polyline([G[i-1],G[i]], {color:PH[ST[i].p].color, weight:isFly?2:3.6, opacity:.95,
      dashArray:isFly?'7,9':null}).addTo(prog);
    map.panTo(G[i], {animate:true, duration:.4});
    select(i, false); i++;
  }, 560);
};

document.getElementById('sideToggle').onclick=()=>document.getElementById('side').classList.remove('hide');
map.on('click', ()=>{ if(window.innerWidth<=860) document.getElementById('side').classList.add('hide'); });
select(0,false);
map.fitBounds(L.latLngBounds(G), {padding:[50,50]});
</script>
</body>
</html>
